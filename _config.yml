# Basic
name:               "Spaceship or Carrot?"
description:        "Jack Goffinet's blog"

author:
  github:           jackgoffinet
  soundcloud:       jackgoffinet


copyright:
  # year:             2018
  name:             Jack Goffinet

# Google-analytics
google-analytics:
  id:               "UA-91117435-1"

# Disqus
# disqus:
#   id:               "jackgoffinet"

# URL
url:                "https://jackgoffinet.github.io" # the base hostname & protocol for your site
# url:                "http://localhost:4000" # use this url when you develop
baseurl:            "" # the subpath of your site, e.g. /blog


# http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone:           America/New_York
permalink:          /:year-:month-:day/:title/

# Pagination
paginate:           5
paginate_path:      /page:num/

# Markdown
markdown:           kramdown
kramdown:
  input:            GFM

# Navigation
nav:
  - name:           "About"
    url:            "/about"
  - name:           "Writing"
    url:            "/writing"
  - name:           "Archive"
    url:            "/archive"
  - name:           "Tags"
    url:            "/tags"
  - name:           "RSS"
    url:            "/feed.xml"

# Sass
sass:
  sass_dir:         _sass
  style:            :compressed

# Scopes
defaults:
  -
    scope:
      path:         ""
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      path:         ""
      type:         "posts"
    values:
      layout:       "post"


# jekyll-seo-tag, see: http://www.rubydoc.info/gems/jekyll-seo-tag/1.2.0
gems:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-admin
  - jekyll-feed

exclude:            [vendor]
